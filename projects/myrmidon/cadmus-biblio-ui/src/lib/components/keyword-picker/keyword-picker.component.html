<!-- no <form>: this picker can be nested in other editors -->
<div>
  <mat-autocomplete
    #lookupAuto="matAutocomplete"
    [displayWith]="keywordToString"
    (optionSelected)="pickKeyword($event.option.value)"
  >
    @for (k of keywords$ | async; track k) {
    <mat-option [value]="k">
      {{ keywordToString(k) }}
    </mat-option>
    }
  </mat-autocomplete>

  <mat-form-field>
    <input
      matInput
      type="text"
      [placeholder]="label()"
      [formField]="form.lookup"
      [matAutocomplete]="lookupAuto"
      (keydown.enter)="$event.preventDefault()"
    />
    <button
      type="button"
      mat-icon-button
      matSuffix
      (click)="clear()"
      [disabled]="!form.lookup().value()"
      matTooltip="Clear"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </mat-form-field>
</div>

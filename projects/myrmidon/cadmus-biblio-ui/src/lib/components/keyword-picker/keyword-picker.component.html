<!-- stop propagation: this form can be nested in other forms -->
<form [formGroup]="form" (submit)="$event.stopPropagation()">
  <mat-autocomplete
    #lookupAuto="matAutocomplete"
    [displayWith]="keywordToString"
    (optionSelected)="pickKeyword($event.option.value)"
  >
    @for (k of keywords$ | async; track k) {
    <mat-option [value]="k">
      {{ keywordToString(k) }}
    </mat-option>
    }
  </mat-autocomplete>

  <mat-form-field>
    <input
      matInput
      type="text"
      [placeholder]="label()"
      [formControl]="lookup"
      [matAutocomplete]="lookupAuto"
    />
    <button
      type="button"
      mat-icon-button
      matSuffix
      (click)="clear()"
      [disabled]="!lookup.value"
      matTooltip="Clear"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
  </mat-form-field>
</form>
